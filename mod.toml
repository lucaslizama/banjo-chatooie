# Config file for the Banjo-Kazooie: Recompiled Twitch chat overlay mod.

[manifest]

# Unique ID of this mod. Must never collide with another mod's ID.
id = "lucas_banjo_chatooie"

version = "0.2.0"

display_name = "Banjo-Chatooie (Beta)"

description = """
BETA, with a known crash. The game still crashes after roughly ten minutes \
with everything enabled; it is not diagnosed yet. Nothing is corrupted, but you \
will lose unsaved progress. The !say command and the overlay have both had long \
clean runs if you would rather avoid it.

Shows your Twitch chat on screen while you play.

Set your channel name in this mod's options and chat appears in the corner of \
the screen. The connection is anonymous and read-only -- the mod never asks for \
a Twitch account, password or OAuth token, and it cannot send messages.

Requires the banjo_chatooie_native library to sit next to this mod's .nrm file \
in the mods folder.

Licensed CC BY-SA 4.0: share and adapt freely, with credit, keeping derivatives \
under the same terms."""

short_description = "Beta: your Twitch chat talks through the game's text boxes."

authors = [ "Lucas" ]

# ID of the target recomp game.
game_id = "bk"

minimum_recomp_version = "0.0.1"

dependencies = [ ]

optional_dependencies = [ ]

# The native half of the mod. `name` is not just a label: the runtime appends the
# platform's library extension to it and looks for the result in the folder
# CONTAINING the .nrm -- so `banjo_chatooie_native.so` goes in the mods folder,
# alongside banjo_chatooie.nrm, not inside it.
#
# Every function the MIPS side imports with RECOMP_IMPORT(".", ...) has to be
# listed here, or the mod fails to load with an invalid import error.
native_libraries = [
    { name = "banjo_chatooie_native", funcs = [
        "twitch_chat_start",
        "twitch_chat_stop",
        "twitch_chat_get_state",
        "twitch_chat_next_message",
        "twitch_redemptions_start",
        "twitch_redemptions_stop",
        "twitch_redemptions_get_state",
    ] }
]

[[manifest.config_options]]
id = "channel"
name = "Twitch Channel"
description = "The channel whose chat to show, without the '#'. Leave blank to disconnect."
type = "String"
default = ""

[[manifest.config_options]]
id = "overlay_enabled"
name = "Show Chat Overlay"
description = "The chat panel in the corner of the screen. Turn it off to keep only the in-game text boxes."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "line_count"
name = "Lines Shown"
description = "How many chat messages to keep on screen."
type = "Number"
min = 1
max = 10
step = 1
precision = 0
percent = false
default = 6

[[manifest.config_options]]
id = "corner"
name = "Position"
description = "Which corner of the screen the chat panel sits in."
type = "Enum"
options = [ "Top Left", "Top Right", "Bottom Left", "Bottom Right" ]
default = "Bottom Left"

[[manifest.config_options]]
id = "text_size"
name = "Text Size"
description = "Chat text size, in screen units."
type = "Number"
min = 12
max = 48
step = 1
precision = 0
percent = false
default = 22

[[manifest.config_options]]
id = "background_opacity"
name = "Background Opacity"
description = "How solid the panel behind the chat is."
type = "Number"
min = 0
max = 100
step = 5
precision = 0
percent = false
default = 45

[[manifest.config_options]]
id = "speak_trigger"
name = "Characters Speak On"
description = "What makes a game character read a message aloud in a text box. Both channel point options need Twitch Affiliate; 'Channel point reward' also needs the helper script running. The !say command works on any channel."
type = "Enum"
options = [ "Off", "Channel point reward", "Highlight My Message", "!say command", "Every message" ]
default = "!say command"

[[manifest.config_options]]
id = "speak_permission"
name = "Who Can Use !say"
description = "Restrict the !say command to you and your moderators, or let anyone in chat use it."
type = "Enum"
options = [ "Anyone", "Mods & Broadcaster" ]
default = "Anyone"

[[manifest.config_options]]
id = "default_character"
name = "Default Character"
description = "Who speaks when nobody picks a character. Chatters choose one by starting with e.g. 'mumbo:' -- so '!say mumbo: hello'. Names: banjo, kazooie, bottles, mumbo, grunty, tooty, brentilda, cheato, klungo, boggy, gobi, rubee, tiptup, jinjo, and more."
type = "String"
default = "bottles"

[[manifest.config_options]]
id = "speak_show_name"
name = "Say Who Sent It"
description = "Put the chatter's name in front of the spoken message."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "debug_boot_map"
name = "Debug: Boot To Map"
description = "Developer option. Skips the intro and file select and drops straight into a level on launch, using a SEPARATE scratch save file so your real save is untouched. The world comes up as an empty file. Leave Off to play normally."
type = "Enum"
options = [ "Off", "Spiral Mountain", "Mumbo's Mountain", "Treasure Trove Cove", "Clanker's Cavern", "Bubblegloop Swamp", "Lair: MM Lobby" ]
default = "Off"

[[manifest.config_options]]
id = "hide_commands"
name = "Hide Bot Commands"
description = "Skip messages starting with '!', which are usually aimed at chat bots."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

# Inputs to the mod tool.
[inputs]

elf_path = "build/mod.elf"

mod_filename = "banjo_chatooie"

# Reference symbol files.
func_reference_syms_file = "BanjoRecompSyms/bk.us.rev0.syms.toml"
data_reference_syms_files = [ "BanjoRecompSyms/bk.us.rev0.datasyms.toml" ]

# Nothing to bundle -- the native library is deployed beside the .nrm, not inside it.
additional_files = [ ]
